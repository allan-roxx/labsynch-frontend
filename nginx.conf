server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # ── Django static files (collected into the shared volume) ───────────────
    location /static/ {
        alias /app/django_static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Django media (uploaded files) ────────────────────────────────────────
    location /media/ {
        alias /app/django_media/;
    }

    # ── Django backend: API, django-admin, OpenAPI docs ─────────────────────
    location ~ ^/(api|django-admin|schema|redoc|swagger-ui)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── React SPA — catch-all ────────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
